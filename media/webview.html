<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src ${webview.cspSource} https:; script-src 'unsafe-inline' ${webview.cspSource} https://cdnjs.cloudflare.com https://unpkg.com; style-src ${webview.cspSource} 'unsafe-inline' https://fonts.googleapis.com; font-src ${webview.cspSource} https://fonts.gstatic.com; connect-src ${webview.cspSource};">
    <title>BOB AI - Workspace Visualizer</title>
    <!-- Cytoscape.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- Dagre layout library: cytoscape-dagre captures window.dagre at load time, so this MUST come first -->
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <!-- Dagre layout extension for Cytoscape.js (exposes window.cytoscapeDagre) -->
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <aside class="sidebar-left">
            <h2>Controls</h2>
            <div class="control-group">
                <div class="control-item">
                    <span>Model Depth</span>
                    <span style="color: var(--accent-green)">Full</span>
                </div>
                <div class="control-item control-item-hint">
                    <span>Bob 2.0 analysis</span>
                    <span>sample data</span>
                </div>
                <button class="btn" id="refreshBtn">Refresh Graph</button>
                <button class="btn btn-secondary btn-block" id="exportBtn"
                        disabled
                        title="Not available yet - requires the Bob 2.0 backend to produce a real graph.">
                    Export JSON
                </button>
            </div>
        </aside>

        <!-- Center Panel -->
        <main class="main-panel">
            <div id="breadcrumb" class="breadcrumb-bar" style="display: none;">
                <button id="backBtn" class="btn-back">← Back to Workspace</button>
                <span id="breadcrumbText">Workspace > </span>
            </div>
            <div id="cy"></div>
        </main>

        <!-- Right Sidebar -->
        <aside class="sidebar-right">
            <div class="panel-section" id="detailsPanel">
                <h2>Node Details</h2>
                <div id="nodeInfo">
                    <div class="empty-state">Select a node to analyze its logic</div>
                </div>
            </div>
            <div class="panel-section panel-section-grow">
                <h2>Bob Agent</h2>
                <div class="chat-placeholder">
                    <strong>Not connected</strong>
                    <span>Ask questions about any node once the Bob 2.0 backend is wired up.</span>
                </div>
            </div>
        </aside>
    </div>
    <script src="{{jsUri}}"></script>
</body>
</html>
